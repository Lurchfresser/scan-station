# Betrieb mit Dokploy hinter Traefik.
#
# Dokploy: Compose-App aus diesem Repository anlegen, Variablen aus
# .env.example in den Environment-Tab kopieren und unter "Domains" die Domain
# auf Service scan-station, Port 8080 legen. Dokploy haengt den Container
# dabei ins dokploy-network und setzt die Traefik-Labels selbst.
#
# Lokal ohne Dokploy: cp .env.example .env, Werte eintragen,
# SCAN_TRUST_PROXY=false setzen und voruebergehend einen Port freigeben:
#   ports: ["8081:8080"]

services:
  scan-station:
    build:
      context: .
      args:
        # true nimmt ocrmypdf und Tesseract mit auf (ca. 600 MB mehr).
        WITH_OCR: "true"
    image: scan-station:local
    # brscan2 gibt es nur als amd64-Paket.
    platform: linux/amd64
    restart: unless-stopped

    # Normales Bridge-Netz genuegt: Der Treiber baut nur ausgehende
    # Verbindungen zum Scanner auf (TCP 54921), die gehen ueber das NAT von
    # Docker. Kein Port wird veroeffentlicht, erreichbar nur ueber Traefik.

    environment:
      TZ: Europe/Berlin
      SCAN_USERS: ${SCAN_USERS:?SCAN_USERS fehlt, Format id:Name:PIN[:target],...}
      SCAN_TRUST_PROXY: ${SCAN_TRUST_PROXY:-true}
      SCAN_RETENTION_DAYS: ${SCAN_RETENTION_DAYS:-7}
      SCAN_OCR_LANG: ${SCAN_OCR_LANG:-deu+eng}
      SCAN_PUBLIC_URL: ${SCAN_PUBLIC_URL:-}
      # Paperless-ngx (fuer Personen mit target paperless).
      PAPERLESS_URL: ${PAPERLESS_URL:-}
      PAPERLESS_TOKEN: ${PAPERLESS_TOKEN:-}
      # Matrix-Benachrichtigungen (optional).
      MATRIX_HOMESERVER: ${MATRIX_HOMESERVER:-}
      MATRIX_TOKEN: ${MATRIX_TOKEN:-}
      SCAN_MATRIX_USERS: ${SCAN_MATRIX_USERS:-}
      # IP des Scanners. Im Router auf eine feste Adresse festnageln.
      SCANNER_IP: ${SCANNER_IP:-192.168.178.98}
      SCANNER_MODEL: "MFC-5440CN"
      SCANNER_NAME: "MFC-5440CN"
      # Besitzer der Dateien im Datenordner. `id -u` und `id -g` auf dem Host.
      PUID: "1000"
      PGID: "1000"

    volumes:
      # Fester Pfad auf dem Host, damit die Scans ein Redeploy ueberleben.
      - ${DATA_DIR:-/opt/scan-station-data}:/data
